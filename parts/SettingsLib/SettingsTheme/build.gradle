plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.android.settingslib.widget.theme'

    defaultConfig {
        minSdk 21
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main {
            res.srcDirs = ['../fwb/packages/SettingsLib/SettingsTheme/res']
            java.srcDirs = ['../fwb/packages/SettingsLib/SettingsTheme/src']
        }
    }
}

dependencies {
    implementation libs.material
    implementation libs.preference

    implementation project(':SettingsLib:SettingsThemeFlags')
}
